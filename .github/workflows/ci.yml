name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code -- src/shared/api/schema.generated.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
